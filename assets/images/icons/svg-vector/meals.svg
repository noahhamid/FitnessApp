<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
      
  <defs>
    <!-- Core Brand Gradients -->
    <!-- Primary Red 3D Jelly Gradient (Top-Left lit to Bottom-Right deep) -->
    <linearGradient id="redJelly" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#FF5C5C" />
      <stop offset="35%" stop-color="#E53935" />
      <stop offset="85%" stop-color="#C62828" />
      <stop offset="100%" stop-color="#9E1616" />
    </linearGradient>

    <!-- Secondary Lighter Red for raised surfaces -->
    <linearGradient id="redJellyLight" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#FF7575" />
      <stop offset="40%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#D32F2F" />
    </linearGradient>

    <!-- Soft Clean White 3D Gradient -->
    <linearGradient id="whiteJelly" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF5F5" />
      <stop offset="100%" stop-color="#F2E6E6" />
    </linearGradient>

    <!-- Gloss Specular Highlight (Pure White to Transparent) -->
    <linearGradient id="topGloss" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Pink Accent Highlight (#FFB3B0) -->
    <linearGradient id="pinkAccent" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFE0DE" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FFB3B0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFB3B0" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Bevel Gloss -->
    <radialGradient id="radialGloss" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Dark Red Contact Shadow Filter -->
    <filter id="contactShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.58
        0 0 0 0 0.08
        0 0 0 0 0.08
        0 0 0 0.32 0" />
      <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
    </filter>

    <!-- Element Drop Shadow (for white elements casting soft shadow on red) -->
    <filter id="softInnerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#8E1414" flood-opacity="0.35" />
    </filter>

    <!-- Shadow for floating white parts -->
    <filter id="whitePartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#801010" flood-opacity="0.3" />
    </filter>
  </defs>

      <!-- Soft Dark-Red Contact Shadow -->
      <ellipse cx="256" cy="455" rx="140" ry="22" fill="#8C1313" opacity="0.32" filter="blur(14px)" />

      <!-- Steam Floating Up (Clean White 3D Wisps) -->
      <path d="M 210 145 C 200 120, 220 95, 210 75" stroke="url(#whiteJelly)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.8" filter="url(#whitePartShadow)" />
      <path d="M 260 135 C 250 105, 275 85, 265 60" stroke="url(#whiteJelly)" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.9" filter="url(#whitePartShadow)" />
      <path d="M 310 145 C 300 120, 320 95, 310 75" stroke="url(#whiteJelly)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.8" filter="url(#whitePartShadow)" />

      <!-- Food: Fluffy White Meal/Rice Dome inside Bowl -->
      <ellipse cx="256" cy="235" rx="160" ry="85" fill="url(#whiteJelly)" filter="drop-shadow(0px 8px 10px rgba(120, 15, 15, 0.25))" />
      <ellipse cx="256" cy="225" rx="135" ry="60" fill="#FFF5F5" />
      <!-- Food Texture / Garnish accents in Red -->
      <circle cx="230" cy="215" r="9" fill="url(#redJelly)" />
      <circle cx="256" cy="205" r="11" fill="url(#redJelly)" />
      <circle cx="282" cy="215" r="9" fill="url(#redJelly)" />

      <!-- Red Ceramic Bowl Base & Body -->
      <path d="M 96 235 
               C 105 375, 180 435, 256 435 
               C 332 435, 407 375, 416 235 
               Z" 
            fill="url(#redJelly)" 
            filter="drop-shadow(0px 10px 14px rgba(110, 12, 12, 0.4))" />

      <!-- Bowl Foot Ring -->
      <ellipse cx="256" cy="432" rx="76" ry="16" fill="url(#redJellyLight)" />
      <ellipse cx="256" cy="434" rx="68" ry="12" fill="#9E1616" opacity="0.4" />

      <!-- Bowl Top Rim (Curved Coral-Red Lip) -->
      <ellipse cx="256" cy="235" rx="165" ry="24" fill="none" stroke="url(#redJellyLight)" stroke-width="14" />

      <!-- White Utensil: 3D Glossy Spoon Resting Across the Bowl -->
      <g transform="rotate(28 256 240)">
        <rect x="180" y="222" width="180" height="24" rx="12" fill="url(#whiteJelly)" filter="url(#whitePartShadow)" />
        <ellipse cx="360" cy="234" rx="42" ry="28" fill="url(#whiteJelly)" filter="url(#whitePartShadow)" />
        <!-- Spoon hollow -->
        <ellipse cx="360" cy="234" rx="32" ry="20" fill="#FFF0F0" />
        <!-- Spoon Specular Highlight -->
        <path d="M 200 226 L 330 226" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      </g>

      <!-- Bowl 3D Glossy Jelly Specular Highlights -->
      <!-- Left flank gloss crescent -->
      <path d="M 125 255 C 130 330, 165 390, 215 415 C 205 385, 185 320, 175 260 Z" fill="url(#pinkAccent)" />
      <!-- Sharp white reflection -->
      <path d="M 136 265 C 142 320, 165 370, 195 395" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.85" />
    </svg>