<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
      
  <defs>
    <!-- Core Brand Gradients -->
    <!-- Primary Red 3D Jelly Gradient (Top-Left lit to Bottom-Right deep) -->
    <linearGradient id="redJelly" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#FF5C5C" />
      <stop offset="35%" stop-color="#E53935" />
      <stop offset="85%" stop-color="#C62828" />
      <stop offset="100%" stop-color="#9E1616" />
    </linearGradient>

    <!-- Secondary Lighter Red for raised surfaces -->
    <linearGradient id="redJellyLight" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#FF7575" />
      <stop offset="40%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#D32F2F" />
    </linearGradient>

    <!-- Soft Clean White 3D Gradient -->
    <linearGradient id="whiteJelly" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF5F5" />
      <stop offset="100%" stop-color="#F2E6E6" />
    </linearGradient>

    <!-- Gloss Specular Highlight (Pure White to Transparent) -->
    <linearGradient id="topGloss" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Pink Accent Highlight (#FFB3B0) -->
    <linearGradient id="pinkAccent" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFE0DE" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FFB3B0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFB3B0" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Bevel Gloss -->
    <radialGradient id="radialGloss" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Dark Red Contact Shadow Filter -->
    <filter id="contactShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.58
        0 0 0 0 0.08
        0 0 0 0 0.08
        0 0 0 0.32 0" />
      <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
    </filter>

    <!-- Element Drop Shadow (for white elements casting soft shadow on red) -->
    <filter id="softInnerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#8E1414" flood-opacity="0.35" />
    </filter>

    <!-- Shadow for floating white parts -->
    <filter id="whitePartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#801010" flood-opacity="0.3" />
    </filter>
  </defs>

      <!-- Soft Dark-Red Contact Shadow -->
      <ellipse cx="256" cy="460" rx="145" ry="24" fill="#8C1313" opacity="0.32" filter="blur(14px)" />

      <!-- 4 RED CORNER FOCUS BRACKETS (Chubby, Rounded 3D Jelly Forms) -->
      <!-- TOP-LEFT BRACKET -->
      <path d="M 88 185 L 88 140 C 88 110, 110 88, 140 88 L 185 88" 
            stroke="url(#redJelly)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" 
            filter="drop-shadow(0px 8px 10px rgba(120, 15, 15, 0.4))" />
      <!-- Top-left bracket gloss highlight -->
      <path d="M 94 175 L 94 140 C 94 116, 116 94, 140 94 L 175 94" 
            stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />

      <!-- TOP-RIGHT BRACKET -->
      <path d="M 327 88 L 372 88 C 402 88, 424 110, 424 140 L 424 185" 
            stroke="url(#redJelly)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" 
            filter="drop-shadow(0px 8px 10px rgba(120, 15, 15, 0.4))" />
      <path d="M 337 94 L 372 94 C 396 94, 418 116, 418 140 L 418 175" 
            stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7" />

      <!-- BOTTOM-LEFT BRACKET -->
      <path d="M 88 327 L 88 372 C 88 402, 110 424, 140 424 L 185 424" 
            stroke="url(#redJelly)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" 
            filter="drop-shadow(0px 8px 10px rgba(120, 15, 15, 0.4))" />
      <path d="M 94 337 L 94 372 C 94 396, 116 418, 140 418 L 175 418" 
            stroke="#FFB3B0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.75" />

      <!-- BOTTOM-RIGHT BRACKET -->
      <path d="M 327 424 L 372 424 C 402 424, 424 402, 424 372 L 424 327" 
            stroke="url(#redJelly)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" 
            filter="drop-shadow(0px 8px 10px rgba(120, 15, 15, 0.4))" />

      <!-- WHITE LENS CENTER (Large, Floating Circular Camera Lens) -->
      <!-- Outer White Lens Ring/Barrel -->
      <circle cx="256" cy="256" r="102" fill="url(#whiteJelly)" filter="drop-shadow(0px 10px 14px rgba(120, 15, 15, 0.35))" />
      <!-- Secondary Inner Ring -->
      <circle cx="256" cy="256" r="84" fill="#FFF2F2" />
      <!-- Central Focus Ring (Brand Coral-Red) -->
      <circle cx="256" cy="256" r="62" fill="url(#redJelly)" />
      <!-- Center Aperture Element (White and Coral Red) -->
      <circle cx="256" cy="256" r="34" fill="url(#whiteJelly)" />
      <circle cx="256" cy="256" r="18" fill="#E53935" />

      <!-- Lens 3D Specular Sheen (Curved White Reflection) -->
      <ellipse cx="232" cy="230" rx="42" ry="24" transform="rotate(-35 232 230)" fill="#FFFFFF" opacity="0.75" />
      <ellipse cx="225" cy="225" rx="14" ry="8" transform="rotate(-35 225 225)" fill="#FFFFFF" opacity="0.95" />
      
      <!-- Subtle Crosshair reticle ticks in clean white -->
      <rect x="253" y="162" width="6" height="16" rx="3" fill="#FFFFFF" />
      <rect x="253" y="334" width="6" height="16" rx="3" fill="#FFFFFF" />
      <rect x="162" y="253" width="16" height="6" rx="3" fill="#FFFFFF" />
      <rect x="334" y="253" width="16" height="6" rx="3" fill="#FFFFFF" />
    </svg>