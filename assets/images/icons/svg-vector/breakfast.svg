<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
      
  <defs>
    <!-- Core Brand Gradients -->
    <!-- Primary Red 3D Jelly Gradient (Top-Left lit to Bottom-Right deep) -->
    <linearGradient id="redJelly" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#FF5C5C" />
      <stop offset="35%" stop-color="#E53935" />
      <stop offset="85%" stop-color="#C62828" />
      <stop offset="100%" stop-color="#9E1616" />
    </linearGradient>

    <!-- Secondary Lighter Red for raised surfaces -->
    <linearGradient id="redJellyLight" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#FF7575" />
      <stop offset="40%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#D32F2F" />
    </linearGradient>

    <!-- Soft Clean White 3D Gradient -->
    <linearGradient id="whiteJelly" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF5F5" />
      <stop offset="100%" stop-color="#F2E6E6" />
    </linearGradient>

    <!-- Gloss Specular Highlight (Pure White to Transparent) -->
    <linearGradient id="topGloss" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Pink Accent Highlight (#FFB3B0) -->
    <linearGradient id="pinkAccent" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFE0DE" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FFB3B0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFB3B0" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Bevel Gloss -->
    <radialGradient id="radialGloss" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Dark Red Contact Shadow Filter -->
    <filter id="contactShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.58
        0 0 0 0 0.08
        0 0 0 0 0.08
        0 0 0 0.32 0" />
      <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
    </filter>

    <!-- Element Drop Shadow (for white elements casting soft shadow on red) -->
    <filter id="softInnerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#8E1414" flood-opacity="0.35" />
    </filter>

    <!-- Shadow for floating white parts -->
    <filter id="whitePartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#801010" flood-opacity="0.3" />
    </filter>
  </defs>

      <!-- Soft Dark-Red Contact Shadow -->
      <ellipse cx="256" cy="460" rx="145" ry="24" fill="#8C1313" opacity="0.32" filter="blur(14px)" />

      <!-- Warm White Steam Waves (No orange flame! Clean white & soft pinkish only) -->
      <path d="M 215 140 C 205 110, 225 80, 215 55" stroke="url(#whiteJelly)" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.85" filter="url(#whitePartShadow)" />
      <path d="M 265 130 C 255 95, 280 70, 270 45" stroke="url(#whiteJelly)" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.95" filter="url(#whitePartShadow)" />
      <path d="M 315 140 C 305 110, 325 80, 315 55" stroke="url(#whiteJelly)" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.85" filter="url(#whitePartShadow)" />

      <!-- Mug Handle (Chubby, Rounded Coral-Red Ear on Right) -->
      <path d="M 320 240 
               C 420 240, 420 380, 320 380" 
            stroke="url(#redJelly)" 
            stroke-width="44" 
            stroke-linecap="round" 
            fill="none" 
            filter="drop-shadow(0px 8px 12px rgba(110, 12, 12, 0.35))" />
      <!-- Handle Top Gloss Highlight -->
      <path d="M 330 244 C 400 244, 400 310, 375 340" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.8" />

      <!-- Mug Body: Plump, Rounded Ceramic Red Mug -->
      <rect x="126" y="200" width="220" height="225" rx="55" fill="url(#redJelly)" filter="drop-shadow(0px 12px 16px rgba(110, 12, 12, 0.4))" />

      <!-- Mug Rim Oval -->
      <ellipse cx="236" cy="202" rx="110" ry="32" fill="url(#redJellyLight)" />
      
      <!-- Rich Warm Dark Coffee Surface -->
      <ellipse cx="236" cy="204" rx="100" ry="26" fill="#801010" />

      <!-- Thick White Latte Foam / Crema Dome -->
      <ellipse cx="236" cy="202" rx="92" ry="22" fill="url(#whiteJelly)" />
      <!-- Latte Art: Clean Coral-Red Heart on the Foam -->
      <path d="M 236 214 
               C 236 214, 214 202, 214 193 
               C 214 186, 222 184, 228 188 
               C 232 191, 236 195, 236 195 
               C 236 195, 240 191, 244 188 
               C 250 184, 258 186, 258 193 
               C 258 202, 236 214, 236 214 Z" 
            fill="url(#redJelly)" />

      <!-- Mug Body 3D Specular Gloss Highlights -->
      <!-- Left side elongated specular gloss pill -->
      <rect x="148" y="240" width="22" height="135" rx="11" fill="url(#pinkAccent)" />
      <rect x="152" y="250" width="10" height="90" rx="5" fill="#FFFFFF" opacity="0.9" />

      <!-- Top lip specular arc -->
      <path d="M 145 204 C 180 216, 260 216, 315 204" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75" />
    </svg>