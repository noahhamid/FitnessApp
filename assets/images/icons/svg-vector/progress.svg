<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
      
  <defs>
    <!-- Core Brand Gradients -->
    <!-- Primary Red 3D Jelly Gradient (Top-Left lit to Bottom-Right deep) -->
    <linearGradient id="redJelly" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#FF5C5C" />
      <stop offset="35%" stop-color="#E53935" />
      <stop offset="85%" stop-color="#C62828" />
      <stop offset="100%" stop-color="#9E1616" />
    </linearGradient>

    <!-- Secondary Lighter Red for raised surfaces -->
    <linearGradient id="redJellyLight" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#FF7575" />
      <stop offset="40%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#D32F2F" />
    </linearGradient>

    <!-- Soft Clean White 3D Gradient -->
    <linearGradient id="whiteJelly" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF5F5" />
      <stop offset="100%" stop-color="#F2E6E6" />
    </linearGradient>

    <!-- Gloss Specular Highlight (Pure White to Transparent) -->
    <linearGradient id="topGloss" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Pink Accent Highlight (#FFB3B0) -->
    <linearGradient id="pinkAccent" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFE0DE" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FFB3B0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFB3B0" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Bevel Gloss -->
    <radialGradient id="radialGloss" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Dark Red Contact Shadow Filter -->
    <filter id="contactShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.58
        0 0 0 0 0.08
        0 0 0 0 0.08
        0 0 0 0.32 0" />
      <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
    </filter>

    <!-- Element Drop Shadow (for white elements casting soft shadow on red) -->
    <filter id="softInnerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#8E1414" flood-opacity="0.35" />
    </filter>

    <!-- Shadow for floating white parts -->
    <filter id="whitePartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#801010" flood-opacity="0.3" />
    </filter>
  </defs>

      <!-- Soft Dark-Red Contact Shadow -->
      <ellipse cx="256" cy="460" rx="150" ry="24" fill="#8C1313" opacity="0.32" filter="blur(14px)" />

      <!-- Clean White Baseline (Thick rounded bar with soft 3D volume) -->
      <rect x="80" y="405" width="352" height="34" rx="17" fill="url(#whiteJelly)" filter="drop-shadow(0px 8px 10px rgba(120, 15, 15, 0.3))" />
      <!-- Baseline top highlight -->
      <rect x="96" y="409" width="320" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9" />

      <!-- 3 Ascending 3D Jelly Bars (Vibrant Coral Red) -->
      <!-- BAR 1 (Low) -->
      <g>
        <rect x="110" y="295" width="70" height="115" rx="26" fill="url(#redJelly)" filter="drop-shadow(0px 6px 8px rgba(110, 12, 12, 0.35))" />
        <!-- Top cap gloss -->
        <ellipse cx="145" cy="308" rx="24" ry="12" fill="url(#redJellyLight)" />
        <ellipse cx="145" cy="305" rx="15" ry="6" fill="#FFFFFF" opacity="0.8" />
        <!-- Vertical sheen -->
        <rect x="120" y="325" width="10" height="60" rx="5" fill="#FFFFFF" opacity="0.75" />
      </g>

      <!-- BAR 2 (Medium) -->
      <g>
        <rect x="221" y="215" width="70" height="195" rx="26" fill="url(#redJelly)" filter="drop-shadow(0px 8px 10px rgba(110, 12, 12, 0.35))" />
        <!-- Top cap gloss -->
        <ellipse cx="256" cy="228" rx="24" ry="12" fill="url(#redJellyLight)" />
        <ellipse cx="256" cy="225" rx="15" ry="6" fill="#FFFFFF" opacity="0.8" />
        <!-- Vertical sheen -->
        <rect x="231" y="245" width="10" height="130" rx="5" fill="#FFFFFF" opacity="0.75" />
      </g>

      <!-- BAR 3 (High) -->
      <g>
        <rect x="332" y="135" width="70" height="275" rx="26" fill="url(#redJelly)" filter="drop-shadow(0px 10px 12px rgba(110, 12, 12, 0.35))" />
        <!-- Top cap gloss -->
        <ellipse cx="367" cy="148" rx="24" ry="12" fill="url(#redJellyLight)" />
        <ellipse cx="367" cy="145" rx="15" ry="6" fill="#FFFFFF" opacity="0.8" />
        <!-- Vertical sheen -->
        <rect x="342" y="165" width="10" height="195" rx="5" fill="#FFFFFF" opacity="0.75" />
      </g>

      <!-- Dynamic Upward Growth Indicator / Trend Line & Arrow -->
      <!-- Smooth ascending line in Clean White -->
      <path d="M 120 270 
               C 170 230, 230 180, 360 85" 
            stroke="url(#whiteJelly)" 
            stroke-width="22" 
            stroke-linecap="round" 
            fill="none" 
            filter="drop-shadow(0px 8px 10px rgba(100, 10, 10, 0.4))" />

      <!-- White Arrowhead at Peak pointing up-right -->
      <path d="M 330 65 
               L 395 75 
               L 385 140 
               Z" 
            fill="url(#whiteJelly)" 
            stroke="url(#whiteJelly)" 
            stroke-width="12" 
            stroke-linejoin="round" 
            filter="drop-shadow(0px 8px 10px rgba(100, 10, 10, 0.4))" />

      <!-- Arrow accent dot & gloss -->
      <circle cx="365" cy="95" r="9" fill="url(#redJelly)" />
      <path d="M 135 255 C 180 220, 240 170, 350 85" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" />
    </svg>