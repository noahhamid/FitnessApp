<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
      
  <defs>
    <!-- Core Brand Gradients -->
    <!-- Primary Red 3D Jelly Gradient (Top-Left lit to Bottom-Right deep) -->
    <linearGradient id="redJelly" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#FF5C5C" />
      <stop offset="35%" stop-color="#E53935" />
      <stop offset="85%" stop-color="#C62828" />
      <stop offset="100%" stop-color="#9E1616" />
    </linearGradient>

    <!-- Secondary Lighter Red for raised surfaces -->
    <linearGradient id="redJellyLight" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#FF7575" />
      <stop offset="40%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#D32F2F" />
    </linearGradient>

    <!-- Soft Clean White 3D Gradient -->
    <linearGradient id="whiteJelly" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF5F5" />
      <stop offset="100%" stop-color="#F2E6E6" />
    </linearGradient>

    <!-- Gloss Specular Highlight (Pure White to Transparent) -->
    <linearGradient id="topGloss" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Pink Accent Highlight (#FFB3B0) -->
    <linearGradient id="pinkAccent" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFE0DE" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FFB3B0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFB3B0" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Bevel Gloss -->
    <radialGradient id="radialGloss" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Dark Red Contact Shadow Filter -->
    <filter id="contactShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.58
        0 0 0 0 0.08
        0 0 0 0 0.08
        0 0 0 0.32 0" />
      <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
    </filter>

    <!-- Element Drop Shadow (for white elements casting soft shadow on red) -->
    <filter id="softInnerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#8E1414" flood-opacity="0.35" />
    </filter>

    <!-- Shadow for floating white parts -->
    <filter id="whitePartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#801010" flood-opacity="0.3" />
    </filter>
  </defs>

      <!-- Soft Dark-Red Contact Shadow -->
      <ellipse cx="256" cy="455" rx="150" ry="24" fill="#8C1313" opacity="0.32" filter="blur(14px)" />

      <!-- Barbell Rotated at dynamic 32 degree 3D angle -->
      <g transform="rotate(-30 256 256)">
        <!-- Center Bar (White / Silver Soft 3D Cylinder) -->
        <rect x="120" y="234" width="272" height="44" rx="22" fill="url(#whiteJelly)" filter="drop-shadow(0px 8px 10px rgba(130, 15, 15, 0.3))" />
        <!-- Grip Knurling Bands (Clean subtle red rings) -->
        <rect x="236" y="234" width="8" height="44" rx="3" fill="#E53935" opacity="0.5" />
        <rect x="252" y="234" width="8" height="44" rx="3" fill="#E53935" opacity="0.5" />
        <rect x="268" y="234" width="8" height="44" rx="3" fill="#E53935" opacity="0.5" />
        <!-- White Bar Gloss Streak -->
        <rect x="145" y="239" width="222" height="9" rx="4.5" fill="#FFFFFF" opacity="0.9" />

        <!-- Inner Collar Rings (White 3D rings) -->
        <rect x="148" y="216" width="18" height="80" rx="9" fill="url(#whiteJelly)" filter="url(#whitePartShadow)" />
        <rect x="346" y="216" width="18" height="80" rx="9" fill="url(#whiteJelly)" filter="url(#whitePartShadow)" />

        <!-- LEFT DUMBBELL WEIGHT PLATES -->
        <!-- Outer Big Plate -->
        <rect x="74" y="160" width="46" height="192" rx="23" fill="url(#redJelly)" filter="drop-shadow(0px 8px 12px rgba(100, 10, 10, 0.4))" />
        <!-- Inner Smaller Plate -->
        <rect x="114" y="180" width="38" height="152" rx="19" fill="url(#redJellyLight)" />
        <!-- Left Plate Gloss / Highlights -->
        <rect x="80" y="172" width="12" height="75" rx="6" fill="#FFFFFF" opacity="0.85" />
        <rect x="80" y="168" width="22" height="120" rx="11" fill="url(#pinkAccent)" />

        <!-- RIGHT DUMBBELL WEIGHT PLATES -->
        <!-- Inner Smaller Plate -->
        <rect x="360" y="180" width="38" height="152" rx="19" fill="url(#redJellyLight)" />
        <!-- Outer Big Plate -->
        <rect x="392" y="160" width="46" height="192" rx="23" fill="url(#redJelly)" filter="drop-shadow(0px 8px 12px rgba(100, 10, 10, 0.4))" />
        <!-- Right Plate Highlights -->
        <rect x="398" y="172" width="12" height="75" rx="6" fill="#FFFFFF" opacity="0.85" />
        <rect x="398" y="168" width="22" height="120" rx="11" fill="url(#pinkAccent)" />

        <!-- Weight plate end-caps (White circular accent rings on ends) -->
        <ellipse cx="75" cy="256" rx="6" ry="32" fill="url(#whiteJelly)" />
        <ellipse cx="437" cy="256" rx="6" ry="32" fill="url(#whiteJelly)" />
      </g>
    </svg>